<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Telemetry Dashboard{% endblock %}</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .card {
        padding: 12px;
        border: 1px solid #eee;
        border-radius: 12px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
      }
      .muted {
        color: #666;
        font-size: 12px;
      }
      .btn {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: #fff;
        cursor: pointer;
      }
      .btn:hover {
        background: #f6f6f6;
      }
      select,
      input {
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      .badge {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
      }
      .ok {
        background: #e7f7ef;
        color: #116b3a;
        border: 1px solid #bde7d0;
      }
      .warn {
        background: #fde7e7;
        color: #8b1a1a;
        border: 1px solid #f7c4c4;
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
