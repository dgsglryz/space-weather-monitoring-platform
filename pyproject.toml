[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | staticfiles
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", "staticfiles", ".venv", "venv"]
known_first_party = ["telemetry", "core"]

[tool.pylint.messages_control]
disable = ["C0111", "C0103", "R0903", "R0913"]

[tool.pylint.format]
max-line-length = 100

[tool.pydocstyle]
convention = "google"
match = '(?!test_).*\.py'
match-dir = '(?!migrations|staticfiles|\.venv|venv).*'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

